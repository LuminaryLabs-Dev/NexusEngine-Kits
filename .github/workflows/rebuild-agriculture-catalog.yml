name: Verify Agriculture Catalog

on:
  push:
    branches: [main]
    paths:
      - "manifests/kits/agriculture-domain-kit.json"
      - "manifests/domains/production.json"
      - "manifests/registry.json"
      - "kits/production/agriculture-domain-kit/**"
      - "domains/production/**"
      - "src/index.js"

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build:catalog
      - run: node kits/production/agriculture-domain-kit/smoke.test.mjs
      - name: Reject generated-file drift
        run: git diff --exit-code
