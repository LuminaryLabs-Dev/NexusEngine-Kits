name: Physics First Slice
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Install exact locked packages
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Validate catalog and existing regressions
        run: npm run check
      - name: Prove actual engine ticks
        run: npm run test:physics
